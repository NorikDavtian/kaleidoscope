<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedral Recursion — Kaleidoscope Pyramid</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 80px 20px;
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Hedral Recursion</h1>
            <div class="subtitle">A pyramid is what a kaleidoscope looks like when you let it recede. Mirrors hold the plane; triangular convergence carves the depth.</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (VARIABLE) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Mirror Folds</label>
                    <div class="slider-container">
                        <input type="range" id="folds" min="3" max="20" step="1" value="10" oninput="updateParam('folds', this.value)">
                        <span class="value-display" id="folds-value">10</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pyramid Depth</label>
                    <div class="slider-container">
                        <input type="range" id="tiers" min="4" max="34" step="1" value="16" oninput="updateParam('tiers', this.value)">
                        <span class="value-display" id="tiers-value">16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Apex Convergence</label>
                    <div class="slider-container">
                        <input type="range" id="convergence" min="0.35" max="2.60" step="0.05" value="0.95" oninput="updateParam('convergence', this.value)">
                        <span class="value-display" id="convergence-value">0.95</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Twist per Tier</label>
                    <div class="slider-container">
                        <input type="range" id="twist" min="-0.16" max="0.16" step="0.005" value="0.035" oninput="updateParam('twist', this.value)">
                        <span class="value-display" id="twist-value">0.035</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Facet Density</label>
                    <div class="slider-container">
                        <input type="range" id="facets" min="2" max="20" step="1" value="9" oninput="updateParam('facets', this.value)">
                        <span class="value-display" id="facets-value">9</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Vertex Drift</label>
                    <div class="slider-container">
                        <input type="range" id="jitter" min="0" max="46" step="1" value="14" oninput="updateParam('jitter', this.value)">
                        <span class="value-display" id="jitter-value">14</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Edge Glow</label>
                    <div class="slider-container">
                        <input type="range" id="glow" min="0.02" max="0.55" step="0.01" value="0.16" oninput="updateParam('glow', this.value)">
                        <span class="value-display" id="glow-value">0.16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Facet Fill</label>
                    <div class="slider-container">
                        <input type="range" id="fillAlpha" min="0" max="0.20" step="0.005" value="0.045" oninput="updateParam('fillAlpha', this.value)">
                        <span class="value-display" id="fillAlpha-value">0.045</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Base Rotation</label>
                    <div class="slider-container">
                        <input type="range" id="rotation" min="0" max="360" step="1" value="0" oninput="updateParam('rotation', this.value)">
                        <span class="value-display" id="rotation-value">0</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (VARIABLE) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Base Tier</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#4b2f7a" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#4b2f7a</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Mid Tier</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#d97757" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Apex</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#79e8dc" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#79e8dc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Field</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#080711" onchange="updateColor('color4', this.value)">
                        <span class="color-value" id="color4-value">#080711</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="regenerate()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row">
                    <button class="button tertiary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // HEDRAL RECURSION — PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            folds: 10,          // mirror count — default 10, the tetractys
            tiers: 16,          // pyramid depth
            convergence: 0.95,  // exponent on triangular-number radii
            twist: 0.035,       // radians of rotation added per tier
            facets: 9,          // angular subdivisions inside the half-wedge
            jitter: 14,         // coherent-noise vertex drift, in pixels
            glow: 0.16,         // additive stroke alpha
            fillAlpha: 0.045,   // additive facet fill alpha
            rotation: 0,        // base rotation, degrees
            colorPalette: ['#4b2f7a', '#d97757', '#79e8dc'],
            bgColor: '#080711'
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        const SIZE = 1200;
        const CX = SIZE / 2;
        const CY = SIZE / 2;
        const MAXR = 545;

        let lattice = [];     // lattice[tier][index] = {x, y}
        let tierColors = [];

        // ═══════════════════════════════════════════════════════════════════════
        // THE ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        function setup() {
            let cnv = createCanvas(SIZE, SIZE);
            cnv.parent('canvas-container');
            pixelDensity(1);
            noLoop();
            const l = document.querySelector('.loading');
            if (l) l.style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            buildLattice();
            redraw();
        }

        // Tier radii follow triangular numbers: T(n) = n(n+1)/2.
        // The spacing compresses toward the apex the way a stacked pyramid
        // compresses when viewed from directly above.
        function tierRadius(t) {
            const remaining = params.tiers - t;
            const Tn = (remaining * (remaining + 1)) / 2;
            const Ttot = (params.tiers * (params.tiers + 1)) / 2;
            return MAXR * Math.pow(Tn / Ttot, params.convergence);
        }

        function buildLattice() {
            noiseSeed(params.seed);
            randomSeed(params.seed);

            const folds = params.folds;
            const halfWedge = Math.PI / folds;   // half of TWO_PI / folds
            const n = params.facets;

            // A seeded phase offset gives each seed its own family resemblance.
            const px = random(1000);
            const py = random(1000);
            const ripple = random(0.6, 2.4);

            lattice = [];
            tierColors = [];

            const c1 = color(params.colorPalette[0]);
            const c2 = color(params.colorPalette[1]);
            const c3 = color(params.colorPalette[2]);

            for (let t = 0; t <= params.tiers; t++) {
                const baseR = tierRadius(t);
                const twistA = params.twist * t;
                const row = [];

                for (let i = 0; i <= n; i++) {
                    const u = i / n;
                    const a = u * halfWedge + twistA;

                    // Coherent noise — smooth, so neighbouring vertices drift together.
                    const nr = noise(px + t * 0.34, py + i * 0.42) - 0.5;
                    const na = noise(px + 60 + t * 0.29, py + 30 + i * 0.37) - 0.5;

                    // Drift scales with radius so the apex stays a true point.
                    const falloff = baseR / MAXR;
                    const r = baseR + nr * params.jitter * (0.35 + falloff);
                    const ang = a + na * params.jitter * 0.0022 * ripple;

                    row.push({ x: r * Math.cos(ang), y: r * Math.sin(ang) });
                }
                lattice.push(row);

                // Depth-bound palette: the colour gradient IS the depth gradient.
                const d = t / params.tiers;
                tierColors.push(d < 0.5 ? lerpColor(c1, c2, d * 2) : lerpColor(c2, c3, (d - 0.5) * 2));
            }
        }

        function draw() {
            drawField();

            blendMode(ADD);
            const wedge = TWO_PI / params.folds;
            const base = radians(params.rotation);

            for (let f = 0; f < params.folds; f++) {
                for (let m = 0; m < 2; m++) {
                    push();
                    translate(CX, CY);
                    rotate(base + f * wedge);
                    if (m === 1) scale(1, -1);   // reflection across the wedge bisector
                    drawWedge();
                    pop();
                }
            }

            blendMode(BLEND);
            drawApex();
        }

        function drawField() {
            const bg = color(params.bgColor);
            background(bg);

            // A faint pool of light behind the structure, so the apex has somewhere to sit.
            noStroke();
            const halo = color(params.colorPalette[1]);
            for (let i = 30; i > 0; i--) {
                const r = (i / 30) * MAXR * 1.5;
                fill(red(halo), green(halo), blue(halo), 1.7);
                ellipse(CX, CY, r * 2, r * 2);
            }
        }

        function drawWedge() {
            const n = params.facets;
            const tiers = params.tiers;

            for (let t = 0; t < tiers; t++) {
                const inner = lattice[t];
                const outer = lattice[t + 1];
                const col = tierColors[t];
                const d = t / tiers;

                // ── Facet fills: luminance that only exists where geometry overlaps.
                if (params.fillAlpha > 0.0005) {
                    noStroke();
                    fill(red(col), green(col), blue(col), params.fillAlpha * 255);
                    for (let i = 0; i < n; i++) {
                        quad(
                            inner[i].x, inner[i].y,
                            inner[i + 1].x, inner[i + 1].y,
                            outer[i + 1].x, outer[i + 1].y,
                            outer[i].x, outer[i].y
                        );
                    }
                }

                noFill();
                const w = map(d, 0, 1, 1.9, 0.45);
                const a = params.glow * 255;

                // Two passes: a wide soft bloom, then a fine bright edge.
                for (let pass = 0; pass < 2; pass++) {
                    const bloom = pass === 0;
                    strokeWeight(bloom ? w * 3.6 : w);
                    stroke(red(col), green(col), blue(col), bloom ? a * 0.26 : a);

                    // Ring edge — the horizontal course of the tier.
                    beginShape();
                    for (let i = 0; i <= n; i++) vertex(inner[i].x, inner[i].y);
                    endShape();

                    // Rising edges — the pyramid's slant, converging on the apex.
                    for (let i = 0; i <= n; i++) {
                        line(inner[i].x, inner[i].y, outer[i].x, outer[i].y);
                    }
                }

                // Diagonal triangulation — reads as facet shading at a glance.
                strokeWeight(w * 0.55);
                stroke(red(col), green(col), blue(col), a * 0.42);
                for (let i = 0; i < n; i++) {
                    line(inner[i].x, inner[i].y, outer[i + 1].x, outer[i + 1].y);
                }
            }

            // Outermost course, drawn last so the base reads as a firm edge.
            const rim = lattice[0];
            const rc = tierColors[0];
            noFill();
            strokeWeight(2.2);
            stroke(red(rc), green(rc), blue(rc), params.glow * 255 * 1.1);
            beginShape();
            for (let i = 0; i <= params.facets; i++) vertex(rim[i].x, rim[i].y);
            endShape();
        }

        function drawApex() {
            // The vanishing point, given just enough light to be believed.
            const c = color(params.colorPalette[2]);
            noStroke();
            for (let i = 26; i > 0; i--) {
                const r = (i / 26) * 76;
                fill(red(c), green(c), blue(c), 5);
                ellipse(CX, CY, r * 2, r * 2);
            }
            fill(255, 255, 255, 190);
            ellipse(CX, CY, 5, 5);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        const INT_PARAMS = ['folds', 'tiers', 'facets', 'jitter', 'rotation'];

        function updateParam(name, value) {
            params[name] = INT_PARAMS.includes(name) ? parseInt(value) : parseFloat(value);
            const el = document.getElementById(name + '-value');
            if (el) el.textContent = value;
            buildLattice();
            redraw();
        }

        function updateColor(id, value) {
            const el = document.getElementById(id + '-value');
            if (el) el.textContent = value;
            if (id === 'color4') {
                params.bgColor = value;
            } else {
                params.colorPalette[parseInt(id.replace('color', '')) - 1] = value;
            }
            buildLattice();
            redraw();
        }

        function regenerate() {
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('hedral-recursion-seed-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS (FIXED)
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            const keptSeed = params.seed;
            params = JSON.parse(JSON.stringify(defaultParams));
            params.seed = keptSeed;

            ['folds', 'tiers', 'convergence', 'twist', 'facets', 'jitter', 'glow', 'fillAlpha', 'rotation'].forEach(function (k) {
                document.getElementById(k).value = params[k];
                document.getElementById(k + '-value').textContent = params[k];
            });

            for (let i = 0; i < 3; i++) {
                document.getElementById('color' + (i + 1)).value = params.colorPalette[i];
                document.getElementById('color' + (i + 1) + '-value').textContent = params.colorPalette[i];
            }
            document.getElementById('color4').value = params.bgColor;
            document.getElementById('color4-value').textContent = params.bgColor;

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function () {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
